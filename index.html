<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAB4CARD - المتجر الشامل</title>
    
    <!-- مكتبات Firebase الرسمية -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <!-- مكتبة Google Sign-In الحقيقية -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style id="customThemeStyles">
        :root {
            --bg-main: #064e3b;
            --bg-card: #022c22;
            --primary-color: #10b981;
            --text-color: #ffffff;
            --accent-color: #34d399;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-color); margin: 0; padding: 0; padding-bottom: 20px; }
        
        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 350px; }
        .toast-message { background: var(--bg-card); color: white; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: bold; text-align: center; border: 1px solid var(--primary-color); box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: fadeInOut 3s forwards; pointer-events: auto; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-20px); } 15% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }

        #liveSalesBanner {
            position: fixed; bottom: 15px; right: 15px; z-index: 99999;
            background: rgba(2, 44, 34, 0.95); border: 1.5px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            border-radius: 12px; padding: 10px 15px; display: none;
            align-items: center; gap: 10px; font-size: 12px; font-weight: bold;
            color: #fff; max-width: 320px; animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .header { background-color: var(--bg-card); color: white; padding: 12px 20px; display: flex; flex-direction: column; gap: 12px; font-weight: bold; border-bottom: 2px solid var(--primary-color); }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-group { display: flex; align-items: center; gap: 8px; }
        .balance { background-color: rgba(16, 185, 129, 0.2); padding: 4px 10px; border-radius: 15px; font-size: 14px; display: flex; align-items: center; gap: 5px; border: 1px solid var(--primary-color); }

        .search-bar-container { padding: 0 5px; margin-top: 2px; }
        .search-input { width: 100%; padding: 12px 18px; border-radius: 20px; border: 1px solid var(--primary-color); background: var(--bg-card); color: white; font-size: 14px; text-align: right; outline: none; box-sizing: border-box; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .search-input::placeholder { color: #94a3b8; }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px 12px; padding: 20px 15px; direction: rtl; }
        .card-wrapper { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 100%; }
        
        .card-box { 
            background: var(--bg-card); 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            border-radius: 18px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-sizing: border-box; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.3); 
            border: 1px solid var(--primary-color); 
            position: relative; 
            overflow: hidden; 
        }
        
        .card-circle { 
            width: 100% !important; 
            height: 100% !important; 
            border-radius: 0 !important; 
            border: none !important; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: transparent !important; 
            overflow: hidden; 
        }
        
        .card-circle img { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
            border-radius: 16px !important; 
        }
        
        .card-name-outside { 
            margin-top: 10px; 
            font-size: 15px; 
            font-weight: 900; 
            color: #ffffff; 
            text-align: center; 
            letter-spacing: 0.3px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.6); 
        }
        .card-price-outside { margin-top: 2px; font-size: 13px; font-weight: bold; color: var(--accent-color); text-align: center; }

        .page-title { text-align: center; color: #fff; font-size: 20px; font-weight: 900; margin: 20px 0 10px 0; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 44, 34, 0.85); justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; padding: 20px 0; }
        .modal-content { background: #ffffff; color: var(--bg-main); padding: 25px 20px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin: auto; border: 2px solid var(--primary-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 15px; color: var(--bg-main); }
        .price-tag { background-color: var(--bg-card); color: var(--accent-color); padding: 6px 14px; border-radius: 20px; font-size: 14px; border: 1px solid var(--primary-color); }
        
        .modal input, .modal select { 
            width: 100%; padding: 12px; margin: 8px 0; border: 1.5px solid var(--primary-color); border-radius: 12px; box-sizing: border-box; text-align: right; background-color: #f8fafc !important; color: #0f172a !important; font-family: inherit; font-size: 14px; font-weight: bold; outline: none; 
        }

        .coupon-group { display: flex; gap: 6px; margin-bottom: 8px; }
        .coupon-btn { background: var(--bg-card); color: var(--accent-color); border: 1px solid var(--primary-color); padding: 0 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .buy-action-btn { flex: 1; background-color: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .cancel-action-btn { flex: 1; background-color: #ffffff; color: #f87171; border: 1px solid #f87171; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        #vipTiersPage, #addBalancePage, #paymentFormPage, #adminDashboardPage, #myOrdersPage, #orderDetailsPage, #myPaymentsPage, #supportPage, #searchResultsPage, #aboutPage, #termsPage, #transactionsHistoryPage, #dynamicCategoryViewPage, #changePasswordModal { display: none; }

        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(2, 44, 34, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background-color: var(--bg-main); color: white; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 350px; position: relative; border: 2px solid var(--primary-color); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .login-box h2 { color: var(--accent-color); font-size: 22px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--primary-color); border-radius: 8px; box-sizing: border-box; text-align: right; background: var(--bg-card); color: white; }
        .login-box button { background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-google { background-color: #fff !important; color: #555 !important; border: 1px solid #ccc !important; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; width: 100%; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-google img { width: 20px; }
        
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 10000; top: 0; right: 0; background-color: var(--bg-card); overflow-x: hidden; transition: 0.3s; padding-top: 40px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); text-align: right; border-left: 2px solid var(--primary-color); }
        .sidebar a { padding: 12px 20px; text-decoration: none; font-size: 14px; color: var(--accent-color); display: block; border-bottom: 1px solid rgba(16, 185, 129, 0.2); font-weight: bold; }
        .sidebar .close-btn { position: absolute; top: 0; right: 15px; font-size: 30px; border-bottom: none; cursor: pointer; color: white; }

        /* ستايل صفحة طلباتي المعززة */
        .orders-filter-box { background: var(--bg-card); padding: 15px; border-radius: 16px; border: 1px solid var(--primary-color); margin-bottom: 15px; direction: rtl; }
        .order-card-item { background: #111827; border: 1px solid #374151; border-radius: 14px; padding: 14px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; direction: rtl; }
        .order-card-item:hover { border-color: var(--primary-color); }
        .order-status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
        .status-approved { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
        .status-rejected { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }

        /* ستايل صفحة تفاصيل الطلب */
        .detail-row-card { background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
        .detail-label { color: #9ca3af; font-size: 13px; font-weight: bold; }
        .detail-value { color: #ffffff; font-size: 14px; font-weight: 900; word-break: break-all; text-align: left; }

        .pf-container { padding: 20px; direction: rtl; background-color: var(--bg-main); min-height: 100vh; color: white; }
        .pf-header { text-align: center; margin-bottom: 25px; }
        .pf-title { font-size: 22px; font-weight: 900; color: var(--accent-color); margin: 0; }
        .pf-field-group { margin-bottom: 15px; }
        .pf-label { display: block; font-size: 12px; color: #a7f3d0; margin-bottom: 6px; padding-right: 5px; }
        .pf-input { width: 100%; padding: 14px; border: 1px solid var(--primary-color); border-radius: 10px; background-color: var(--bg-card) !important; color: white !important; box-sizing: border-box; text-align: right; font-family: inherit; font-size: 14px; outline: none; }
        .pf-btn-submit { width: 100%; background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }

        #adminDashboardPage { background-color: var(--bg-card); min-height: 100vh; height: 100vh; overflow-y: auto; width: 100%; box-sizing: border-box; padding-bottom: 80px; }
        .admin-wrapper { padding: 20px; direction: rtl; background-color: var(--bg-card); color: white; box-sizing: border-box; width: 100%; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--bg-main); color: white; padding: 15px; border-radius: 12px; border-bottom: 2px solid var(--primary-color); }
        .admin-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .admin-tab { flex: 1; min-width: 60px; text-align: center; padding: 10px 4px; background: var(--bg-main); border-radius: 8px; font-weight: bold; cursor: pointer; color: var(--accent-color); font-size: 11px; border: 1px solid var(--primary-color); }
        .admin-tab.active { background: var(--primary-color); color: white; }
        .request-card { background: var(--bg-main); color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border-right: 4px solid var(--primary-color); border: 1px solid rgba(16, 185, 129, 0.3); width: 100%; box-sizing: border-box; }
        .req-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-acc { background: var(--primary-color); color: white; border: none; padding: 8px; flex: 1; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-rej { background: #ef4444; color: white; border: none; padding: 8px; flex: 1; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .stat-card { background: var(--bg-main); border: 1px solid var(--primary-color); border-radius: 10px; padding: 15px; text-align: center; flex: 1; }
        .stat-num { font-size: 20px; font-weight: 900; color: var(--accent-color); }
        .stat-title { font-size: 11px; color: #a7f3d0; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <div id="liveSalesBanner">
        <span style="font-size: 18px;">🛒</span>
        <span id="liveSalesText"></span>
    </div>

    <!-- واجهة تسجيل الدخول مع كلمة المرور -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box" id="mainLoginBox">
            <h2>مرحباً بك في ARAB4CARD</h2>
            <input type="email" id="userEmailInput" placeholder="أدخل بريدك الإلكتروني (gmail.com)...">
            <input type="password" id="userPasswordInput" placeholder="أدخل كلمة المرور الحساب...">
            <button onclick="loginUser()">دخول / تسجيل حساب</button>
            <div style="margin: 15px 0; border-top: 1px solid var(--primary-color); position: relative;">
                <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--bg-main); padding: 0 10px; font-size: 12px; color: var(--accent-color);">أو</span>
            </div>
            <button class="btn-google" onclick="triggerGoogleLogin()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                المتابعة باستخدام Google
            </button>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <div id="sideMenu" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">×</a>
        <div style="text-align: center; padding: 10px 15px; border-bottom: 1px solid rgba(16, 185, 129, 0.3);">
            <div style="width: 55px; height: 55px; background: var(--bg-main); border-radius: 50%; margin: 0 auto 8px auto; display: flex; align-items: center; justify-content: center; border: 2px solid var(--primary-color); font-size: 22px;">👤</div>
            <div style="font-size: 13px; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap;">
                <span id="sidebarUserName">مستخدم</span>
                <span style="font-size: 10px; color: #94a3b8;" id="sidebarUserNumericId">#7271</span>
                <span id="sidebarUserVipBadge" style="background: rgba(245, 158, 11, 0.2); color: #f59e0b; padding: 2px 6px; border-radius: 8px; font-size: 10px; border: 1px solid #f59e0b;">⭐ مبدئي</span>
            </div>
        </div>

        <div style="text-align: center; padding: 12px; font-size: 18px; font-weight: 900; color: white; border-bottom: 1px solid rgba(16, 185, 129, 0.3);">
            $<span id="sidebarBalanceDisplay">0.020</span>
        </div>

        <a href="#" onclick="showPage('homePage'); closeSidebar()">🏠 الرئيسية</a>
        <a href="#" onclick="showPage('addBalancePage'); closeSidebar()">💳 إضافة رصيد</a>
        <a href="#" onclick="showMyPaymentsPage(); closeSidebar()">🧾 دفعاتي</a>
        <a href="#" onclick="showMyOrdersPage(); closeSidebar()">📦 طلباتي</a>
        <a href="#" onclick="showPage('supportPage'); closeSidebar()">🎧 الدعم الفني</a>
        <a href="#" onclick="openAdminLogin(); closeSidebar()" style="color: var(--accent-color);">⚙️ لوحة التحكم (Admin)</a>
        <a href="#" onclick="logoutUser(); closeSidebar()" style="color: #f87171; margin-top: 10px;">🚪 تسجيل خروج</a>
    </div>

    <!-- الهيدر العلوي -->
    <div class="header">
        <div class="header-top-row">
            <div class="header-group">
                <div style="font-size: 22px; cursor: pointer; color: var(--accent-color);" onclick="openSidebar()">☰</div>
                <div id="headerVipBadge" style="background: rgba(16, 185, 129, 0.2); padding: 4px 8px; border-radius: 12px; font-size: 13px; border: 1px solid var(--primary-color); color:var(--accent-color);">⭐ مبدئي</div>
                <div class="balance">
                    💰 <span id="userBalanceDisplay" style="color: var(--accent-color); font-weight: bold;">0.010</span>
                </div>
            </div>
            <div class="header-group">
                <div style="font-weight: 900; font-family: 'Arial Black'; font-size: 18px; color: var(--primary-color);">A<span style="color:var(--accent-color);">4</span>C</div>
                <div id="backBtn" style="display:none; font-size:22px; cursor:pointer; color:var(--accent-color);" onclick="goBack()">←</div>
            </div>
        </div>
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="homePage" style="display: block;">
        <div class="page-title" style="font-size: 16px; text-align: right; padding-right: 15px; margin-top: 15px;">🏷️ الأقسام الرئيسية</div>
        <div class="grid-container" id="dynamicMainCategoriesGrid"></div>
    </div>

    <!-- صفحة طلباتي المعدلة بالطريقة المطلوبة -->
    <div id="myOrdersPage">
        <div class="page-title">طلباتي</div>
        <div style="padding: 15px; direction: rtl; padding-bottom: 80px;">
            
            <!-- فلاتر التواريخ والبحث -->
            <div class="orders-filter-box">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label style="font-size: 11px; color: #9ca3af; display: block; margin-bottom: 3px;">من</label>
                        <input type="date" id="orderFilterFrom" onchange="renderMyOrders()" style="width: 100%; padding: 8px; background: #1f2937; color: white; border: 1px solid #374151; border-radius: 8px; box-sizing: border-box; font-size: 12px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 11px; color: #9ca3af; display: block; margin-bottom: 3px;">إلى</label>
                        <input type="date" id="orderFilterTo" onchange="renderMyOrders()" style="width: 100%; padding: 8px; background: #1f2937; color: white; border: 1px solid #374151; border-radius: 8px; box-sizing: border-box; font-size: 12px;">
                    </div>
                </div>

                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" id="orderSearchBox" placeholder="بحث..." oninput="renderMyOrders()" style="flex: 1; padding: 10px; background: #1f2937; color: white; border: 1px solid #374151; border-radius: 8px; outline: none; font-size: 13px;">
                </div>

                <!-- أزرار التصفية بالحالة -->
                <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px;">
                    <button onclick="setOrderTabFilter('all')" id="btnTabAll" style="padding: 6px 14px; background: var(--primary-color); color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer;">الكل</button>
                    <button onclick="setOrderTabFilter('approved')" id="btnTabApproved" style="padding: 6px 14px; background: #1f2937; color: #9ca3af; border: 1px solid #374151; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer;">مقبول</button>
                    <button onclick="setOrderTabFilter('pending')" id="btnTabPending" style="padding: 6px 14px; background: #1f2937; color: #9ca3af; border: 1px solid #374151; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer;">انتظار</button>
                    <button onclick="setOrderTabFilter('rejected')" id="btnTabRejected" style="padding: 6px 14px; background: #1f2937; color: #9ca3af; border: 1px solid #374151; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer;">مرفوض</button>
                </div>
            </div>

            <!-- إجمالي المبالغ -->
            <div style="text-align: center; margin-bottom: 15px; background: #1f2937; padding: 10px; border-radius: 12px; border: 1px solid #374151; font-weight: 900; font-size: 15px; color: var(--accent-color);">
                إجمالي : <span id="ordersTotalSum">$ 0.000</span>
            </div>

            <!-- قائمة الطلبات -->
            <div id="myOrdersListContainer"></div>
        </div>
    </div>

    <!-- صفحة تفاصيل الطلب المفردة (المطابقة للصورة) -->
    <div id="orderDetailsPage">
        <div style="padding: 15px; direction: rtl; padding-bottom: 80px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0; font-size: 20px; font-weight: 900; color: white;">تفاصيل الطلب</h2>
                <button onclick="showPage('myOrdersPage')" style="background: #1f2937; color: white; border: 1px solid #374151; padding: 6px 18px; border-radius: 8px; font-weight: bold; cursor: pointer;">رجوع</button>
            </div>

            <div id="orderDetailsCardContent"></div>
        </div>
    </div>

    <!-- نافذة الطلب -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalItemTitle">المنتج</span>
                <span class="price-tag" id="modalItemPrice">$ 0.00</span>
            </div>
            <input type="text" id="playerId" placeholder="الايدي (Player ID)">
            
            <div class="modal-buttons">
                <button class="buy-action-btn" onclick="submitGameOrder()">شراء وتأكيد</button>
                <button class="cancel-action-btn" onclick="closeOrderModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم الإدارية -->
    <div id="adminDashboardPage">
        <div class="admin-wrapper">
            <div class="admin-header">
                <h2 style="margin:0;">لوحة التحكم</h2>
            </div>
            <div class="admin-tabs">
                <div class="admin-tab active" id="tabOrders" onclick="switchAdminTab('orders')">طلبات الألعاب</div>
            </div>
            <div id="adminOrdersSection"></div>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "admin@arab9card.com";

        const firebaseConfig = {
            apiKey: "AIzaSyAFN8LX9K5yqkwFCbME0epZWGVkkVKXaMg",
            authDomain: "arab9card.firebaseapp.com",
            projectId: "arab9card",
            storageBucket: "arab9card.firebasestorage.app",
            messagingSenderId: "258855549504",
            appId: "1:258855549504:web:ab1597d5d5a7d350f33da5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let userBalance = 0.010;
        let gameOrders = [];
        let currentUserEmail = localStorage.getItem("userEmail") || "";
        let currentOrderTabFilter = 'all';

        function showToast(message) {
            let container = document.getElementById('toastContainer');
            let toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        db.collection("orders").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            gameOrders = [];
            snapshot.forEach((doc) => { gameOrders.push({ id: doc.id, ...doc.data() }); });
            renderMyOrders();
        });

        /* دالة تنسيق الوقت بدقة بالثواني */
        function formatFullTimestamp(ts) {
            if (!ts) return "2026-10-24 16:39:39";
            let dateObj = ts.toDate ? ts.toDate() : new Date(ts);
            let year = dateObj.getFullYear();
            let month = String(dateObj.getMonth() + 1).padStart(2, '0');
            let day = String(dateObj.getDate()).padStart(2, '0');
            let hours = String(dateObj.getHours()).padStart(2, '0');
            let minutes = String(dateObj.getMinutes()).padStart(2, '0');
            let seconds = String(dateObj.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds} ${year}-${month}-${day}`;
        }

        function setOrderTabFilter(status) {
            currentOrderTabFilter = status;
            ['btnTabAll', 'btnTabApproved', 'btnTabPending', 'btnTabRejected'].forEach(id => {
                let btn = document.getElementById(id);
                if (btn) {
                    btn.style.background = '#1f2937';
                    btn.style.color = '#9ca3af';
                    btn.style.border = '1px solid #374151';
                }
            });
            let activeBtn = document.getElementById(status === 'all' ? 'btnTabAll' : (status === 'approved' ? 'btnTabApproved' : (status === 'pending' ? 'btnTabPending' : 'btnTabRejected')));
            if (activeBtn) {
                activeBtn.style.background = 'var(--primary-color)';
                activeBtn.style.color = 'white';
                activeBtn.style.border = 'none';
            }
            renderMyOrders();
        }

        function renderMyOrders() {
            let myOrders = gameOrders.filter(o => o.userEmail === currentUserEmail);
            let search = document.getElementById('orderSearchBox') ? document.getElementById('orderSearchBox').value.trim().toLowerCase() : '';
            let fromDate = document.getElementById('orderFilterFrom') ? document.getElementById('orderFilterFrom').value : '';
            let toDate = document.getElementById('orderFilterTo') ? document.getElementById('orderFilterTo').value : '';

            let filtered = myOrders.filter(o => {
                let matchStatus = currentOrderTabFilter === 'all' || o.status === currentOrderTabFilter;
                let matchSearch = !search || (o.product && o.product.toLowerCase().includes(search)) || (o.playerId && o.playerId.includes(search)) || o.id.includes(search);
                return matchStatus && matchSearch;
            });

            let totalSum = filtered.reduce((sum, o) => sum + (parseFloat(o.price) || 0), 0);
            if (document.getElementById('ordersTotalSum')) {
                document.getElementById('ordersTotalSum').innerText = `$ ${totalSum.toFixed(3)}`;
            }

            let html = filtered.length === 0 ? '<p style="text-align:center; color:#9ca3af; margin-top:20px;">لا توجد طلبات مطابقة</p>' : '';
            
            filtered.forEach(order => {
                let shortId = "ID_" + order.id.substring(0, 15);
                let formattedTime = formatFullTimestamp(order.timestamp);
                let badgeClass = order.status === 'pending' ? 'status-pending' : (order.status === 'approved' ? 'status-approved' : 'status-rejected');
                let badgeText = order.status === 'pending' ? '⏳ قيد التنفيذ' : (order.status === 'approved' ? '✅ مقبول' : '❌ مرفوض');

                html += `
                <div class="order-card-item" onclick="openOrderDetails('${order.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span class="order-status-badge ${badgeClass}">${badgeText}</span>
                        <span style="font-size:12px; color:#9ca3af; font-family:monospace;">${shortId}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:bold; font-size:14px; color:white; margin-bottom:4px;">${order.productName || order.product}</div>
                            <div style="font-size:11px; color:#9ca3af;">#${order.playerId || 'بدون آيدي'}</div>
                        </div>
                        <div style="text-align:left;">
                            <div style="font-weight:900; color:var(--accent-color); font-size:14px;">$ ${parseFloat(order.price || 0).toFixed(3)}</div>
                            <div style="font-size:10px; color:#6b7280; margin-top:3px;">${formattedTime}</div>
                        </div>
                    </div>
                </div>`;
            });

            let container = document.getElementById('myOrdersListContainer');
            if (container) container.innerHTML = html;
        }

        /* دالة فتح تفاصيل الطلب مثل الصورة المقابلة */
        function openOrderDetails(orderId) {
            let order = gameOrders.find(o => o.id === orderId);
            if (!order) return;

            let fullId = "ID_" + order.id;
            let formattedTime = formatFullTimestamp(order.timestamp);
            let badgeClass = order.status === 'pending' ? 'status-pending' : (order.status === 'approved' ? 'status-approved' : 'status-rejected');
            let badgeText = order.status === 'pending' ? 'قيد التنفيذ' : (order.status === 'approved' ? 'مقبول' : 'مرفوض');
            let replyText = order.adminReply || order.reply || "لا يوجد رد بعد";

            let detailsHtml = `
                <div class="detail-row-card">
                    <span class="detail-label">رقم العملية</span>
                    <span class="detail-value" style="font-family:monospace; font-size:12px;">${fullId}</span>
                </div>
                <div class="detail-row-card">
                    <span class="detail-label">المنتج</span>
                    <span class="detail-value">${order.productName || order.product}</span>
                </div>
                <div class="detail-row-card">
                    <span class="detail-label">الكمية</span>
                    <span class="detail-value">1</span>
                </div>
                <div class="detail-row-card">
                    <span class="detail-label">السعر الإجمالي</span>
                    <span class="detail-value" style="color:var(--accent-color);">$ ${parseFloat(order.price || 0).toFixed(3)}</span>
                </div>
                <div class="detail-row-card">
                    <span class="detail-label">التاريخ والوقت بالثانية</span>
                    <span class="detail-value" style="font-family:monospace;">${formattedTime}</span>
                </div>
                <div class="detail-row-card">
                    <span class="detail-label">playerId</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="detail-value">${order.playerId || 'غير متوفر'}</span>
                        <span onclick="navigator.clipboard.writeText('${order.playerId}'); showToast('تم نسخ الايدي!')" style="cursor:pointer; font-size:14px;" title="نسخ">📋</span>
                    </div>
                </div>
                
                <div style="text-align:center; margin: 20px 0;">
                    <span class="order-status-badge ${badgeClass}" style="font-size:16px; padding:8px 24px;">${badgeText}</span>
                </div>

                <div style="background:#111827; border:1px solid #374151; border-radius:12px; padding:15px; text-align:right;">
                    <div style="color:#9ca3af; font-size:12px; margin-bottom:8px; font-weight:bold;">الرد:</div>
                    <div style="color:white; font-size:14px; font-weight:bold; background:#1f2937; padding:10px; border-radius:8px; border:1px solid var(--primary-color); word-break:break-all;">
                        ${replyText}
                    </div>
                </div>
            `;

            document.getElementById('orderDetailsCardContent').innerHTML = detailsHtml;
            showPage('orderDetailsPage');
        }

        let currentPage = 'homePage';
        function showPage(pageId) {
            const pages = ['homePage', 'addBalancePage', 'adminDashboardPage', 'myOrdersPage', 'orderDetailsPage', 'supportPage'];
            pages.forEach(p => { let el = document.getElementById(p); if (el) el.style.display = 'none'; });
            let targetEl = document.getElementById(pageId);
            if (targetEl) targetEl.style.display = 'block';
            currentPage = pageId;
        }

        function showMyOrdersPage() { renderMyOrders(); showPage('myOrdersPage'); }
        function openSidebar() { document.getElementById("sideMenu").style.width = "260px"; }
        function closeSidebar() { document.getElementById("sideMenu").style.width = "0"; }

        function submitGameOrder() {
            let playerId = document.getElementById('playerId').value.trim();
            if(playerId === "") { showToast("⚠️ يرجى إدخال الايدي!"); return; }
            
            db.collection("orders").add({ 
                product: "Free Fire 100 + 10 Diamond", 
                productName: "Free Fire 100 + 10 Diamond",
                price: 0.953, 
                playerId: playerId,
                status: 'pending', 
                adminReply: '', 
                userEmail: currentUserEmail, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            }).then(() => { 
                showToast("🚀 تم تسجيل طلبك!"); closeOrderModal(); renderMyOrders();
            });
        }
        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }
    </script>
</body>
</html>
